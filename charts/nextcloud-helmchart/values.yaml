# ==============================================================================
# MASTER CONFIGURATION VALUES
# All sub-charts and templates derive their values directly from this file.
# ==============================================================================

# Global security settings
global:
  security:
    allowInsecureImages: true

# 1. Domain Names
domain:
  nextcloud: "nextcloud.sengporkeat.com"
  collabora: "office.sengporkeat.com"

# 2. Administrator Credentials
admin:
  username: "admin"
  password: "Admin@1234"

# 3. Database Engine Selection
# Options: "postgresql" (Recommended for High Traffic), "mariadb", or "sqlite" (Simple / Lightweight)
database:
  type: "postgresql"                    # "postgresql" | "mariadb" | "sqlite"
  username: "admin"
  password: "Admin@1234"
  database: "nextcloud"
  storageSize: 8Gi                      # Ignored when using sqlite

# Disable MariaDB when PostgreSQL is selected
mariadb:
  enabled: false

# 4. Nextcloud UI Theming & Custom Images (Local File Paths)
branding:
  name: "Unity Drive"                   # Name displayed in page title & login
  slogan: "Secure Enterprise Storage"   # Slogan text under the logo
  primaryColor: "#7D54D3"               # Vibrant Brand Purple (Exact sampled logo color)
  backgroundColor: "#000000"            # True OLED Deep Black (Matches background canvas)
  removeBackgroundImage: false          # false = Use custom background image

  # Local File Paths (Files stored inside charts/nextcloud-helmchart/assets/)
  images:
    backgroundImagePath: "assets/background.png"  # Custom login background wallpaper
    logoPath: "assets/logo.png"                    # Main login & page logo
    faviconPath: "assets/favicon.png"              # Browser tab favicon icon
    navBarLogoPath: "assets/nav-logo.png"          # Small top navigation bar logo

# 5. Clean Experience Features (Toggle True / False)
features:
  disableAds: true                 # Disables first-run wizard, promo popups, and recommendations
  disableSkeletonDirectory: true   # Keeps new user accounts 100% empty (no default demo files/photos)
  disableAuditWarning: true        # Completely suppresses Collabora Server Audit popup modal
  enableServerSideEncryption: true # Automatically enables default module and server side encryption

# 6. MinIO S3 Object Storage (Primary Storage)
minio:
  enabled: true
  installEmbedded: true
  image:
    repository: "quay.io/minio/aistor/minio"
    tag: "RELEASE.2026-07-24T16-43-31Z"
  storageSize: 20Gi
  storageClass: "longhorn"
  endpoint: "minio.minio-system.svc.cluster.local"
  port: 9000
  bucket: "nextcloud-data"
  accessKey: "admin"
  secretKey: "Admin@1234"
  useSsl: false
  region: "us-east-1"
  consoleDomain: "minio.sengporkeat.com"
  s3Domain: "s3.sengporkeat.com"
  # Optional: Override internal cluster hostname if using an external MinIO IP
  # externalHostname: "10.1.18.7"
  # useSSL: true

# 7. Redis Session Cache (Bitnami Redis with Debian base)
redis:
  enabled: true
  architecture: standalone
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: latest
  auth:
    enabled: true
    password: "RedisPassword@1234"
  master:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

# 8. Notify Push (High Performance WebSockets Daemon)
notifyPush:
  enabled: true
  replicaCount: 1
  image:
    repository: icewind1991/notify_push
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 9. Preview Pre-generator (Smooth Gallery & Photo Scrolling)
previewGenerator:
  enabled: true
  schedule: "*/15 * * * *"             # Runs background pre-rendering every 15 minutes

# 10. ClamAV Antivirus Daemon (Real-time File Inspection & Ransomware Blocking)
clamav:
  enabled: true
  image:
    repository: clamav/clamav
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 1.5Gi
    limits:
      cpu: 1000m
      memory: 3Gi

# 11. Auto-Scaling (HPA)
autoscaling:
  minReplicas: 2
  maxReplicas: 6
  nextcloudTargetCPU: 70
  collaboraTargetCPU: 75

# ==============================================================================
# CORE WORKLOAD SETTINGS
# ==============================================================================

nextcloud:
  replicaCount: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  hostAliases:
    - ip: "10.233.40.36"
      hostnames:
        - "nextcloud.sengporkeat.com"
        - "office.sengporkeat.com"
        - "minio.sengporkeat.com"
        - "s3.sengporkeat.com"
  nextcloud:
    host: "nextcloud.sengporkeat.com"
    username: "admin"
    password: "Admin@1234"
    
    # High Performance PHP, Session Handler & OPcache Environment Flags
    phpConfigs:
      opcache.ini: |
        opcache.enable=1
        opcache.enable_cli=1
        opcache.memory_consumption=256
        opcache.interned_strings_buffer=32
        opcache.max_accelerated_files=30000
        opcache.revalidate_freq=60
        opcache.fast_shutdown=1
        opcache.save_comments=1
        memory_limit=1024M
        upload_max_filesize=16G
        post_max_size=16G
        max_execution_time=3600
        max_input_time=3600
        session.save_handler = redis
        session.save_path = "tcp://nextcloud-redis-master:6379?auth=RedisPassword%401234"
        session.gc_maxlifetime = 86400
    
    # Auto-mount Configurations & In-Pod Hooks
    extraVolumes:
      - name: s3-config
        configMap:
          name: nextcloud-s3-config

      - name: collabora-config
        configMap:
          name: nextcloud-nextcloud-autoconfig
      - name: clean-experience-config
        configMap:
          name: nextcloud-clean-experience-config
      - name: theming-config
        configMap:
          name: nextcloud-theming-config
          defaultMode: 0755
      - name: performance-config
        configMap:
          name: nextcloud-performance-tuning
      - name: custom-assets
        configMap:
          name: nextcloud-custom-assets
    extraVolumeMounts:
      - name: s3-config
        mountPath: /var/www/html/config/s3.config.php
        subPath: s3.config.php

      - name: collabora-config
        mountPath: /var/www/html/config/collabora.config.php
        subPath: collabora.config.php
      - name: clean-experience-config
        mountPath: /var/www/html/config/clean-experience.config.php
        subPath: clean-experience.config.php
      - name: theming-config
        mountPath: /var/www/html/config/theming.config.php
        subPath: theming.config.php
      - name: theming-config
        mountPath: /docker-entrypoint-hooks.d/before-starting/auto-setup.sh
        subPath: auto-setup.sh
      - name: performance-config
        mountPath: /var/www/html/config/tuning.config.php
        subPath: tuning.config.php
      - name: custom-assets
        mountPath: /custom_assets

    objectStore:
      s3:
        enabled: true
        bucket: "nextcloud-data"
        autocreate: true
        key: "admin"
        secret: "Admin@1234"
        host: "minio.minio-system.svc.cluster.local"
        port: 9000
        useSsl: false
        region: "us-east-1"
        usePathStyle: true
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: nextcloud-system-nextcloud-security-headers@kubernetescrd,nextcloud-system-nextcloud-redirect-dav@kubernetescrd,nextcloud-system-nextcloud-redirect-wellknown@kubernetescrd
      traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
      traefik.ingress.kubernetes.io/service.sticky.cookie.name: "nc_route_sticky"
      traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
      traefik.ingress.kubernetes.io/service.sticky.cookie.httpOnly: "true"
      traefik.ingress.kubernetes.io/service.sticky.cookie.sameSite: "lax"
    path: /
    pathType: Prefix
    tls:
      - hosts:
          - "nextcloud.sengporkeat.com"
        secretName: nextcloud-tls-secret

  internalDatabase:
    enabled: false

  postgresql:
    enabled: true
    auth:
      postgresPassword: "Admin@1234"
      password: "Admin@1234"
      username: "admin"
      database: "nextcloud"
    primary:
      persistence:
        enabled: true
        storageClass: "longhorn"
        size: 8Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi

  externalDatabase:
    enabled: true
    type: postgresql
    host: "nextcloud-postgresql.nextcloud-system.svc.cluster.local:5432"
    database: "nextcloud"
    user: "admin"
    password: "Admin@1234"

  persistence:
    enabled: true
    storageClass: "longhorn"
    accessMode: ReadWriteMany
    size: 8Gi

  startupProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 90

  livenessProbe:
    enabled: true
    initialDelaySeconds: 120
    periodSeconds: 15

  readinessProbe:
    enabled: true
    initialDelaySeconds: 120
    periodSeconds: 15

nextcloudHPA:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Collabora Online Office (Maximum Performance Tuning)
collabora:
  enabled: true
  replicaCount: 2
  image:
    repository: collabora/code
    tag: latest
    pullPolicy: IfNotPresent
  domain: "office.sengporkeat.com"
  aliasGroups:
    - host: "https://nextcloud.sengporkeat.com"
  extraParams: "--o:ssl.enable=false --o:ssl.termination=true --o:mount_jail_tree=true --o:net.proto=IPv4 --o:num_prespawn_children=2 --o:per_document.max_concurrency=2 --o:logging.disable_server_audit=true"
  env:
    - name: username
      value: "admin"
    - name: password
      value: "Admin@1234"
    - name: dictionaries
      value: "en_US"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 3Gi
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    tls:
      - hosts:
          - "office.sengporkeat.com"
        secretName: collabora-office-tls

collaboraHPA:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
