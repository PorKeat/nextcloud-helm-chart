{{- if .Values.previewGenerator.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-preview-generator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: preview-generator
spec:
  schedule: "{{ .Values.previewGenerator.schedule | default "*/15 * * * *" }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: preview-generator
        spec:
          serviceAccountName: {{ .Release.Name }}-admin-sa
          restartPolicy: OnFailure
          containers:
            - name: preview-generator
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  echo "Running Preview Pre-generator background job..."
                  POD_NAME=$(kubectl get pod -l app.kubernetes.io/name=nextcloud -n {{ .Release.Namespace }} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                  if [ -n "$POD_NAME" ]; then
                    kubectl exec -n {{ .Release.Namespace }} $POD_NAME -c nextcloud -- su -s /bin/bash www-data -c "php occ preview:pre-generate"
                    echo "Preview generation completed successfully!"
                  else
                    echo "Nextcloud pod not ready, skipping preview run."
                  fi
{{- end }}
