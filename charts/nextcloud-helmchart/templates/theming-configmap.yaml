{{- if .Values.branding.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-theming-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nextcloud-helmchart.labels" . | nindent 4 }}
data:
  theming.config.php: |
    <?php
    $CONFIG = [
      'theme' => '',
      {{- if .Values.branding.name }}
      'custom_client_name' => '{{ .Values.branding.name }}',
      {{- end }}
      {{- if .Values.branding.slogan }}
      'custom_client_slogan' => '{{ .Values.branding.slogan }}',
      {{- end }}
      'theming.cachebuster' => '{{ randAlphaNum 5 }}',
    ];
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-custom-assets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nextcloud-helmchart.labels" . | nindent 4 }}
binaryData:
  {{- if .Files.Get .Values.branding.images.backgroundImagePath }}
  background.png: {{ .Files.Get .Values.branding.images.backgroundImagePath | b64enc }}
  {{- end }}
  {{- if .Files.Get .Values.branding.images.logoPath }}
  logo.png: {{ .Files.Get .Values.branding.images.logoPath | b64enc }}
  {{- end }}
  {{- if .Files.Get .Values.branding.images.faviconPath }}
  favicon.png: {{ .Files.Get .Values.branding.images.faviconPath | b64enc }}
  {{- end }}
  {{- if .Files.Get .Values.branding.images.navBarLogoPath }}
  nav-logo.png: {{ .Files.Get .Values.branding.images.navBarLogoPath | b64enc }}
  {{- end }}
{{- end }}
