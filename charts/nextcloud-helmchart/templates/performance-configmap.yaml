apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-performance-tuning
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nextcloud-helmchart.labels" . | nindent 4 }}
data:
  tuning.config.php: |
    <?php
    $CONFIG = [
      'memcache.local' => '\OC\Memcache\APCu',
      'memcache.distributed' => '\OC\Memcache\Redis',
      'memcache.locking' => '\OC\Memcache\Redis',
      'redis' => [
        'host' => '{{ .Release.Name }}-redis-master',
        'port' => 6379,
        'password' => '{{ .Values.redis.auth.password | default "RedisPassword@1234" }}',
        'timeout' => 1.5,
      ],
      'default_phone_region' => 'US',
      'maintenance_window_start' => 1,
      
      // High Performance & Instant Routing Tunings
      'enable_previews' => true,
      'preview_max_x' => 1024,
      'preview_max_y' => 1024,
      'preview_max_memory' => 256,
      'preview_max_filesize_image' => 20,
      'preview_concurrency_new' => 4,
      'preview_concurrency_all' => 8,
      
      'filesystem_check_changes' => 0,
      'filelocking.ttl' => 3600,
      'session_lifetime' => 86400,
      'auth.bruteforce.protection.enabled' => true,
      'simpleSignUpLink.shown' => false,
      'backgroundjobs_mode' => 'cron',
      'has_internet_connection' => false,
    ];
