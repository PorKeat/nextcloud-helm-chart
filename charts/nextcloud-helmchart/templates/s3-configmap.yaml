apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-s3-config
  namespace: {{ .Release.Namespace }}
data:
  s3.config.php: |
    <?php
    $CONFIG = array (
      'objectstore' => array(
        'class' => '\OC\Files\ObjectStore\S3',
        'arguments' => array(
          'bucket' => '{{ .Values.minio.bucket | default "nextcloud-data" }}',
          'autocreate' => true,
          'key'    => '{{ .Values.minio.accessKey | default "admin" }}',
          'secret' => '{{ .Values.minio.secretKey | default "Admin@1234" }}',
          'hostname' => '{{ .Values.minio.externalHostname | default (printf "%s-minio" .Release.Name) }}',
          'port' => {{ .Values.minio.port | default 9000 }},
          'use_ssl' => {{ .Values.minio.useSSL | default "false" }},
          'region' => '{{ .Values.minio.region | default "us-east-1" }}',
          'use_path_style' => true,
        ),
      ),
    );
