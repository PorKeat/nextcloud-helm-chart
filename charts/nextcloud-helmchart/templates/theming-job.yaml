apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-apply-theming-job
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nextcloud-theming-job
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: assets-volume
          configMap:
            name: {{ .Release.Name }}-custom-assets
      containers:
        - name: theming-applier
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Nextcloud pod to be ready..."
              kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=nextcloud -n {{ .Release.Namespace }} --timeout=300s
              POD_NAME=$(kubectl get pod -l app.kubernetes.io/name=nextcloud -n {{ .Release.Namespace }} -o jsonpath='{.items[0].metadata.name}')
              echo "Applying custom colors, branding, and Collabora Office..."
              kubectl exec -n {{ .Release.Namespace }} $POD_NAME -c nextcloud -- su -s /bin/bash www-data -c "
                php occ theming:config name '{{ .Values.branding.name | default "Unity Drive" }}'
                php occ theming:config slogan '{{ .Values.branding.slogan | default "Secure Enterprise Storage" }}'
                php occ theming:config primary_color '{{ .Values.branding.primaryColor | default "#7D54D3" }}'
                php occ theming:config background_color '{{ .Values.branding.backgroundColor | default "#000000" }}'
                php occ maintenance:theme:update
                {{- if .Values.features.disableAds }}
                php occ app:disable firstrunwizard
                php occ app:disable recommendations
                php occ app:disable updatenotification
                php occ app:disable survey_client
                {{- end }}
                {{- if .Values.features.disableSkeletonDirectory }}
                php occ config:system:set skeletondirectory --value=''
                {{- end }}
                {{- if .Values.collabora.enabled }}
                echo 'Activating Nextcloud Office (richdocuments) for Collabora...'
                if [ ! -d /var/www/html/apps/richdocuments ]; then
                  curl -L -s https://github.com/nextcloud-releases/richdocuments/releases/download/v11.1.0/richdocuments-v11.1.0.tar.gz -o /tmp/richdocuments.tar.gz
                  tar -xzf /tmp/richdocuments.tar.gz -C /var/www/html/apps/
                fi
                php occ app:enable --force richdocuments
                php occ config:app:set richdocuments wopi_url --value='http://{{ .Release.Name }}-collabora:9980'
                php occ config:app:set richdocuments wopi_override_endpoint --value='https://{{ .Values.domain.collabora | default .Values.collabora.domain }}'
                php occ config:app:set richdocuments public_wopi_url --value='https://{{ .Values.domain.collabora | default .Values.collabora.domain }}'
                php occ config:app:set richdocuments wopi_allowlist --value='10.0.0.0/8,10.233.0.0/16,10.148.0.0/16,127.0.0.1'
                php occ config:system:set allow_local_remote_servers --value=true --type=boolean
                php occ config:app:set richdocuments disable_certificate_verification --value='yes'
                php occ richdocuments:activate-config
                {{- end }}
                php occ config:system:set overwriteprotocol --value='https'
                php occ config:system:set overwritehost --value='{{ .Values.domain.nextcloud | default "nextcloud.sengporkeat.com" }}'
                php occ config:system:set overwrite.cli.url --value='https://{{ .Values.domain.nextcloud | default "nextcloud.sengporkeat.com" }}'
                php occ config:system:set trusted_proxies 0 --value='10.0.0.0/8'
              "
              echo "Theming, clean experience, and Collabora Office applied successfully!"
