{{- if .Values.collabora.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-collabora
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: collabora
spec:
  replicas: {{ .Values.collabora.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: collabora
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collabora
    spec:
      containers:
        - name: collabora
          image: "{{ .Values.collabora.image.repository }}:{{ .Values.collabora.image.tag }}"
          imagePullPolicy: {{ .Values.collabora.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
                - CHOWN
                - FOWNER
                - MKNOD
          env:
            - name: domain
              value: "{{ .Values.domain.nextcloud | default "nextcloud.sengporkeat.com" }}"
            - name: aliasgroup1
              value: "https://{{ .Values.domain.nextcloud | default "nextcloud.sengporkeat.com" }}"
            - name: server_name
              value: "{{ .Values.domain.collabora | default .Values.collabora.domain | default "office.sengporkeat.com" }}"
            - name: DONT_GEN_SSL_CERT
              value: "true"
            - name: extra_params
              value: "--o:ssl.enable=false --o:ssl.termination=true --o:mount_jail_tree=false --o:net.proto=IPv4"
            {{- range .Values.collabora.env }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}
          ports:
            - name: wopi
              containerPort: 9980
              protocol: TCP
          resources:
            {{- toYaml .Values.collabora.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-collabora
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: collabora
spec:
  type: ClusterIP
  ports:
    - port: 9980
      targetPort: 9980
      protocol: TCP
      name: wopi
  selector:
    app.kubernetes.io/name: collabora
{{- end }}
