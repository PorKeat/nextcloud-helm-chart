{{- if and .Values.collabora.enabled .Values.collaboraHPA.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-collabora-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: collabora
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-collabora
  minReplicas: {{ .Values.collaboraHPA.minReplicas | default 2 }}
  maxReplicas: {{ .Values.collaboraHPA.maxReplicas | default 6 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.collaboraHPA.targetCPUUtilizationPercentage | default 75 }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 1
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
