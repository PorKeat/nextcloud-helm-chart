# CUSTOM ENVIRONMENT OVERRIDES
# Any field you change here automatically overrides the default values.yaml

global:
  security:
    allowInsecureImages: true

domain:
  nextcloud: "nextcloud.sengporkeat.com"
  collabora: "office.sengporkeat.com"

# ------------------------------------------------------------------------------
# DATABASE CONFIGURATION
# Options: "postgresql" | "mariadb" | "sqlite"
# ------------------------------------------------------------------------------
database:
  type: "postgresql"                    # "postgresql" | "mariadb" | "sqlite"
  username: "admin"
  password: "Admin@1234"
  database: "nextcloud"
  storageSize: 8Gi                      # Ignored when using sqlite

# Disable MariaDB when PostgreSQL is selected
mariadb:
  enabled: false

# Redis (Official Bitnami Redis)
redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: latest
  auth:
    enabled: true
    password: "RedisPassword@1234"
  master:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

# Notify Push (High Performance WebSockets Daemon)
notifyPush:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Preview Pre-generator (Smooth Gallery & Photo Scrolling)
previewGenerator:
  enabled: true
  schedule: "*/15 * * * *"             # Runs background pre-rendering every 15 minutes

# ClamAV Antivirus Daemon (Real-time File Inspection & Ransomware Blocking)
clamav:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1.5Gi

# Collabora Online Office (Maximum Performance with Lightweight Base Request)
collabora:
  replicaCount: 2
  extraParams: "--o:ssl.enable=false --o:ssl.termination=true --o:mount_jail_tree=true --o:net.proto=IPv4 --o:num_prespawn_children=2 --o:per_document.max_concurrency=2 --o:logging.disable_server_audit=true"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 3Gi

collaboraHPA:
  enabled: true
  minReplicas: 2
  maxReplicas: 3

nextcloud:
  replicaCount: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  hostAliases:
    - ip: "10.233.40.36"
      hostnames:
        - "nextcloud.sengporkeat.com"
        - "office.sengporkeat.com"
        - "minio.sengporkeat.com"
        - "s3.sengporkeat.com"
  persistence:
    enabled: true
    storageClass: "longhorn"
    accessMode: ReadWriteMany
    size: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

nextcloudHPA:
  enabled: true
  minReplicas: 2
  maxReplicas: 3

# ------------------------------------------------------------------------------
# MINIO S3 OBJECT STORAGE
# ------------------------------------------------------------------------------
minio:
  enabled: true
  installEmbedded: true                # Deploy MinIO automatically!
  storageSize: 20Gi
  storageClass: "longhorn"
  accessKey: "admin"
  secretKey: "Admin@1234"
  consoleDomain: "minio.sengporkeat.com"
  s3Domain: "s3.sengporkeat.com"

# Theming & Local Images (Harmonized with Logo and Wallpaper)
branding:
  name: "Unity Drive"                   # Name displayed in page title & login
  slogan: "Secure Enterprise Storage"   # Slogan text under the logo
  primaryColor: "#7D54D3"               # Vibrant Brand Purple (Exact sampled logo color)
  backgroundColor: "#000000"            # True OLED Deep Black (Matches background canvas)
  removeBackgroundImage: false          # false = Use background image
  
  images:
    backgroundImagePath: "assets/background.png"  # Custom login background wallpaper
    logoPath: "assets/logo.png"                    # Main login & page logo
    faviconPath: "assets/favicon.png"              # Browser tab favicon icon
    navBarLogoPath: "assets/nav-logo.png"          # Small top navigation bar logo

features:
  disableAds: true
  disableSkeletonDirectory: true
  disableAuditWarning: true

admin:
  username: "admin"
  password: "Admin@1234"
